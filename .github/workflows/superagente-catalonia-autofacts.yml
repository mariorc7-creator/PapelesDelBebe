name: SuperAgente - Actualización automática de cuantías verificadas (Cataluña)

on:
  workflow_run:
    workflows: ["SuperAgente - Vigilancia oficial automatica (solo lectura)"]
    types: [completed]
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/superagente_catalonia_autofacts.py'
      - 'scripts/test_superagente_catalonia_autofacts.py'
      - 'superagente/catalonia-amount-contract.json'
      - '.github/workflows/superagente-catalonia-autofacts.yml'

permissions:
  contents: read

concurrency:
  group: superagente-catalonia-amounts
  cancel-in-progress: false

jobs:
  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar actualización completa y bloqueo de contradicciones
        run: python -m unittest discover -s scripts -p 'test_superagente_catalonia_autofacts.py' -v

  automatic-facts:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recibir prueba oficial de la vigilancia que acaba de terminar
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/official"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name superagente-official-watch-reports \
            --dir "$RUNNER_TEMP/official"
      - name: Capturar directamente las fuentes al inicio manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          git clone --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/agent"
          git -C "$RUNNER_TEMP/agent" fetch --depth 1 origin acf76b4aebe0d0e08ad148fd8757c50d6758f160
          git -C "$RUNNER_TEMP/agent" checkout acf76b4aebe0d0e08ad148fd8757c50d6758f160
          python "$RUNNER_TEMP/agent/scripts/superagente_official_watch.py" --workers 4
          mkdir -p "$RUNNER_TEMP/official"
          cp "$RUNNER_TEMP/agent/superagente/official-watch-report.json" "$RUNNER_TEMP/official/"
          cp "$RUNNER_TEMP/agent/superagente/official-text-snapshots.json" "$RUNNER_TEMP/official/"
      - name: Comprobar versión oficial y editar todas las referencias juntas
        id: edit
        run: |
          python -m unittest discover -s scripts -p 'test_superagente_catalonia_autofacts.py' -v
          python scripts/superagente_catalonia_autofacts.py \
            --root . \
            --policy superagente/catalonia-amount-contract.json \
            --watch-report "$RUNNER_TEMP/official/official-watch-report.json" \
            --snapshots "$RUNNER_TEMP/official/official-text-snapshots.json" \
            --out "$RUNNER_TEMP/catalonia-amount-update.json" \
            --apply
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rechazar cambios de diseño, URLs o archivos fuera de contrato
        if: steps.edit.outputs.changed == 'true'
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          allowed={
            "comunidades/cataluna/index.html",
            "ayuda-nacimiento-cataluna/index.html",
            "ca/ajut-naixement-catalunya-2026/index.html",
            "superagente/catalonia-amount-contract.json",
          }
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          if changed!=allowed:
              raise SystemExit(f"Unexpected or incomplete factual batch: {changed}")
          print("Verified factual amount batch: exactly 3 pages + source contract")
          PY
      - name: Crear y fusionar PR de datos oficiales cuando las comprobaciones permitan
        if: steps.edit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="batch/superagente-cataluna-importe-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add comunidades/cataluna/index.html ayuda-nacimiento-cataluna/index.html \
            ca/ajut-naixement-catalunya-2026/index.html superagente/catalonia-amount-contract.json
          git commit -m "content: sincronizar cuantías oficiales de ayuda por nacimiento Cataluña"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "SuperAgente: cuantías oficiales actualizadas en tres guías de Cataluña" \
            --body "Valores extraídos de la ficha oficial de Tràmits Gencat, captura vinculada por SHA-256; tres guías ES/CA actualizadas conjuntamente con títulos y datos estructurados solo cuando contienen el dato factual cambiado. Sin optimización SEO rutinaria. Precisa comprobaciones y políticas de fusión del repositorio."
          gh pr merge "$branch" --squash --auto --delete-branch
      - name: Resumen del resultado
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/catalonia-amount-update.json"; then
            cat "$RUNNER_TEMP/catalonia-amount-update.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Revisión detenida: consultar el registro y la fuente oficial" >> "$GITHUB_STEP_SUMMARY"
          fi
