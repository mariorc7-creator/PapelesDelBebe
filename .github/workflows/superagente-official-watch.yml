name: SuperAgente - Vigilancia fuentes oficiales
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/superagente_official_watch.py'
      - 'scripts/superagente_real_legal_cases.py'
      - 'scripts/test_superagente_real_legal_cases.py'
      - 'superagente/acceptance/regional-legal-2026.json'
      - 'scripts/superagente_semantic_evidence.py'
      - 'scripts/test_superagente_semantic_evidence.py'
      - 'scripts/superagente_editorial_loop.py'
      - 'scripts/test_superagente_editorial_loop.py'
      - 'scripts/superagente_official_content_tasks.py'
      - 'scripts/test_superagente_official_content_tasks.py'
      - 'scripts/superagente_official_baseline.py'
      - 'scripts/test_superagente_official_baseline.py'
      - 'superagente/official-watchlist.json'
      - 'superagente/official-baseline.json'
      - '.github/workflows/superagente-official-watch.yml'
permissions:
  contents: read
jobs:
  official-watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evitar regresiones en convocatorias reales 2026
        run: python -m unittest discover -s scripts -p 'test_superagente_real_legal_cases.py' -v
      - name: Check official source fingerprints
        run: python scripts/superagente_official_watch.py
      - name: Validar enlace fuente a página afectada
        run: python -m unittest discover -s scripts -p 'test_superagente_official_content_tasks.py' -v
      - name: Validar conservación de las huellas oficiales
        run: python -m unittest discover -s scripts -p 'test_superagente_official_baseline.py' -v
      - name: Preparar huellas iniciales para revisión independiente
        if: success()
        run: |
          python scripts/superagente_official_baseline.py \
            --watchlist superagente/official-watchlist.json \
            --report superagente/official-watch-report.json \
            --output superagente/official-baseline-candidate.json
      - name: Preparar tareas de actualización sin aprobarlas
        if: success()
        run: |
          python scripts/superagente_official_content_tasks.py \
            --watchlist superagente/official-watchlist.json \
            --watch-report superagente/official-watch-report.json \
            --output superagente/official-content-tasks.json
      - name: Conectar fuentes oficiales con borradores exactos de las guías
        if: success()
        run: |
          python scripts/superagente_editorial_loop.py \
            --watchlist superagente/official-watchlist.json \
            --report superagente/official-watch-report.json \
            --output superagente/official-editorial-queue.json
      - name: Verificar integridad de evidencia y extracción semántica
        run: python -m unittest discover -s scripts -p 'test_superagente_semantic_evidence.py' -v
      - name: Comparar posibles cambios legales sin editar páginas
        if: success()
        run: |
          python scripts/superagente_semantic_evidence.py \
            --watchlist superagente/official-watchlist.json \
            --watch-report superagente/official-watch-report.json \
            --snapshots superagente/official-text-snapshots.json \
            --output superagente/official-semantic-candidates.json
      - name: Upload review alerts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superagente-official-watch
          path: |
            superagente/official-watch-report.json
            superagente/official-content-tasks.json
            superagente/official-baseline-candidate.json
            superagente/official-editorial-queue.json
            superagente/official-text-snapshots.json
            superagente/official-semantic-candidates.json
