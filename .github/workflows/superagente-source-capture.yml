name: SuperAgente - Captura oficial bajo demanda
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-official-html:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate local capture safety tests
        run: python -m unittest discover -s scripts -p 'test_superagente_source_capture.py' -v
      - name: Capture allowlisted official HTML
        run: python scripts/superagente_source_capture.py
      - name: Upload read-only capture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superagente-official-capture
          path: superagente/source-capture-report.json
          retention-days: 7
