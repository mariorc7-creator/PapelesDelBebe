name: SuperAgente - Editorial Evidence CI
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/superagente_evidence_gate.py'
      - 'scripts/test_superagente_evidence_gate.py'
      - 'scripts/superagente_semantic_triage.py'
      - 'scripts/superagente_claim_inventory.py'
      - 'scripts/superagente_linked_triage.py'
      - 'scripts/superagente_source_provenance.py'
      - 'scripts/test_superagente_source_provenance.py'
      - 'superagente/official-watchlist.json'
      - 'scripts/test_superagente_linked_triage.py'
      - 'scripts/test_superagente_claim_inventory.py'
      - 'scripts/test_superagente_semantic_triage.py'
      - 'superagente/editorial-evidence.json'
      - 'superagente/semantic-triage-input.json'
      - '.github/workflows/superagente-evidence.yml'
permissions:
  contents: read
jobs:
  validate-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run editorial regression tests
        run: |
          python -m unittest discover -s scripts -p 'test_superagente_evidence_gate.py' -v
          python -m unittest discover -s scripts -p 'test_superagente_semantic_triage.py' -v
          python -m unittest discover -s scripts -p 'test_superagente_claim_inventory.py' -v
          python -m unittest discover -s scripts -p 'test_superagente_linked_triage.py' -v
          python -m unittest discover -s scripts -p 'test_superagente_source_provenance.py' -v
      - name: Generate read-only page claim inventory
        run: python scripts/superagente_claim_inventory.py
      - name: Upload assertion inventory
        uses: actions/upload-artifact@v4
        with:
          name: superagente-claim-inventory
          path: superagente/claim-inventory.json
          retention-days: 14
      - name: Validate proposed editorial evidence when supplied
        shell: bash
        run: |
          if [ -f superagente/editorial-evidence.json ]; then
            python scripts/superagente_evidence_gate.py superagente/editorial-evidence.json
          else
            echo "No editorial evidence submitted. No editorial approval implied."
          fi
      - name: Verify source domain allowlist
        shell: bash
        run: |
          if [ -f superagente/semantic-triage-input.json ]; then
            python scripts/superagente_source_provenance.py --comparisons superagente/semantic-triage-input.json
          else
            echo 'No comparison input submitted; source provenance checking skipped.'
          fi
      - name: Verify claim anchors against current HTML inventory
        shell: bash
        run: |
          if [ -f superagente/semantic-triage-input.json ]; then
            python scripts/superagente_linked_triage.py --inventory superagente/claim-inventory.json --comparisons superagente/semantic-triage-input.json
          else
            echo 'No comparison input submitted; anchor checking skipped.'
          fi
      - name: Triage paired claims when supplied
        shell: bash
        run: |
          if [ -f superagente/semantic-triage-input.json ]; then
            python scripts/superagente_semantic_triage.py superagente/semantic-triage-input.json
          else
            echo "No paired claims submitted. No semantic verification implied."
          fi
