name: Amazon afiliados - auditoría manual (sin despliegue)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revisar enlaces (solo lectura)
        run: python3 scripts/audit_amazon_affiliates.py --expected-tag mariorc7-21
      - name: Guardar informe incluso con incidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-affiliates-audit
          path: reports/amazon-affiliates-audit.json
          if-no-files-found: warn
