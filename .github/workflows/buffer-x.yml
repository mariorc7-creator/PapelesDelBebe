name: Papeles Bebé - Buffer X
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Prueba de conexión (safe) o publicar un tweet"
        required: true
        type: choice
        options: [test, morning, midday, evening, all]
        default: test
  schedule:
    # Generar los 3 posts antes del primer horario configurado en Buffer.
    # 02:37 UTC = 03:37 invierno / 04:37 verano en Madrid.
    - cron: '37 2 * * *'
permissions:
  contents: write
concurrency:
  group: papeles-bebe-buffer
  cancel-in-progress: false
jobs:
  buffer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar slots de Buffer
        run: echo 'Buffer debe tener los horarios 09:15, 14:02 y 19:15 (Europe/Madrid)'
      - name: Validar sintaxis del generador
        run: node --check scripts/buffer-x-auto.mjs
      - name: Verificar conexión o añadir tweet
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_PUBLISH_ENABLED: ${{ vars.AUTO_PUBLISH_ENABLED }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          MODE: ${{ github.event.inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MODE" = "test" ]; then
            node scripts/buffer-x-auto.mjs
            exit 0
          fi
          if [ "$AUTO_PUBLISH_ENABLED" != "true" ]; then
            echo "Publicación desactivada. Solo prueba de conexión."
            node scripts/buffer-x-auto.mjs
            exit 0
          fi
          if [ "$EVENT_NAME" = "schedule" ] || [ "$MODE" = "all" ]; then
            # Añadir en orden cronológico para respetar las tres franjas de Buffer.
            for SLOT in morning midday evening; do
              echo "Enviando franja $SLOT a la cola de Buffer"
              SLOT="$SLOT" PUBLISH=true node scripts/buffer-x-auto.mjs
            done
          else
            case "$MODE" in
              morning|midday|evening) SLOT="$MODE" PUBLISH=true node scripts/buffer-x-auto.mjs ;;
              *) echo "Modo no reconocido: $MODE"; exit 1 ;;
            esac
          fi
