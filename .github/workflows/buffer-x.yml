name: Papeles Bebé - Buffer X
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Prueba de conexión (safe) o publicar un tweet"
        required: true
        type: choice
        options: [test, morning, evening]
        default: test
  schedule:
    # Franjas de mañana/tarde en UTC. El horario de verano se cubre con dos opciones.
    # La ejecución puede retrasarse: identificamos la franja por el cron, no por la hora real.
    - cron: '17 6,7 * * *'
    - cron: '23 16,17 * * *'
permissions:
  contents: write
concurrency:
  group: papeles-bebe-buffer
  cancel-in-progress: false
jobs:
  buffer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar conexión o añadir tweet
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_PUBLISH_ENABLED: ${{ vars.AUTO_PUBLISH_ENABLED }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          MODE: ${{ github.event.inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$MODE" = "test" ]; then
              node scripts/buffer-x-auto.mjs
            else
              SLOT="$MODE" PUBLISH=true node scripts/buffer-x-auto.mjs
            fi
          else
            case "$SCHEDULE" in
              '17 6,7 * * *') SLOT=morning ;;
              '23 16,17 * * *') SLOT=evening ;;
              *) echo "Error: cron no reconocido: $SCHEDULE"; exit 1 ;;
            esac
            echo "Franja programada: $SLOT; hora actual: $(TZ=Europe/Madrid date +'%Y-%m-%d %H:%M:%S %Z')"
            if [ "$AUTO_PUBLISH_ENABLED" != "true" ]; then echo "Publicación no activada. Ejecutando prueba de conexión."; node scripts/buffer-x-auto.mjs; exit 0; fi
            SLOT="$SLOT" PUBLISH=true node scripts/buffer-x-auto.mjs
          fi
