name: SuperAgente - Memoria y priorizacion segura
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/superagente_decision_memory.py'
      - 'scripts/test_superagente_decision_memory.py'
      - '.github/workflows/superagente-decision-memory.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar memoria de decisiones y bloqueos SEO
        run: python -m unittest discover -s scripts -p 'test_superagente_decision_memory.py' -v
